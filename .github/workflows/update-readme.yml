name: README documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify README entry points
        run: |
          test -s README.md
          grep -q "mermaid" README.md
          grep -q "SECURITY.md" README.md
          test -s docs/README.md
          test -s docs/diagrams/architecture-context.mmd
          echo "README and documentation entry points are present."
