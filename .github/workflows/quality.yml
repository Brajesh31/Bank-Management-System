name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required docs and local Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          required = [
              "README.md", "SECURITY.md", "CONTRIBUTING.md",
              "docs/README.md", "docs/architecture.md",
              "docs/database.md", "docs/testing.md",
              "docs/security-review.md", "TECHNICAL_DEBT.md",
              "docs/diagrams/architecture-context.mmd",
              "docs/diagrams/registration-workflow.mmd",
              "docs/diagrams/transaction-workflow.mmd",
              "docs/diagrams/conceptual-data-model.mmd",
          ]
          errors = [f"Missing required file: {p}" for p in required if not Path(p).is_file()]
          for path in Path(".").rglob("*.md"):
              if any(part in {".git", "bin", "out"} for part in path.parts):
                  continue
              content = path.read_text(encoding="utf-8")
              if content.count("```") % 2:
                  errors.append(f"Unclosed code fence: {path}")
              for target in re.findall(r"!?[[^]]*]\(([^)]+)\)", content):
                  target = target.strip().split("#", 1)[0]
                  if not target or "://" in target or target.startswith(("mailto:", "#")):
                      continue
                  if not (path.parent / target).resolve().exists():
                      errors.append(f"Broken local link in {path}: {target}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Documentation checks passed.")
          PY
      - name: Verify Mermaid sources
        run: |
          test -s docs/diagrams/architecture-context.mmd
          test -s docs/diagrams/registration-workflow.mmd
          test -s docs/diagrams/transaction-workflow.mmd
          test -s docs/diagrams/conceptual-data-model.mmd
